name: VPSFree 自动续期

on:
  workflow_dispatch: # 支持手动点击运行测试
  schedule:
    # 每天 UTC 00:00 和 12:00 (北京时间 08:00 和 20:00) 各执行一次，精准捕捉 24 小时续期窗口
    - cron: '0 0,12 * * *'

permissions:
  actions: write
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # 5个账号 × 平均6分 = 30分钟，给足冗余

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖与 Playwright
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: 自动下载并解压 NopeCHA 验证码插件
        run: |
          echo "创建插件目录..."
          mkdir -p scripts/extensions/nopecha/unpacked
          echo "从官方源下载最新 NopeCHA 插件..."
          curl -fLo nopecha.zip https://github.com/NopeCHALLC/nopecha-extension/releases/latest/download/chromium.zip
          unzip -q -o nopecha.zip -d scripts/extensions/nopecha/unpacked
          echo "插件准备就绪！"
      - name: 后台启动代理服务 (sing-box 动态解析 NODE_LINK)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          echo "下载 sing-box 客户端..."
          curl -Lo sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-1.13.19-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box

          echo "动态解析节点配置 (支持 vmess/vless/tuic/hy2/trojan)..."
          python setup_proxy.py

          echo "后台运行 sing-box..."
          ./sing-box run -c config.json &
          sleep 4
          PROXY_IP=$(curl -s --max-time 10 -x http://127.0.0.1:7890 https://api.ipify.org || echo "")
          echo "代理出口 IP: ${PROXY_IP:-未知}"

      - name: 运行批量续期脚本 (Xvfb 虚拟屏幕环境)
        env:
          VPS_ACCOUNTS: ${{ secrets.VPS_ACCOUNTS }} # 支持多账号 (一行一个: 邮箱----密码)
          VPS_EMAIL: ${{ secrets.VPS_EMAIL }}       # 兼容单账号
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }} # 兼容单账号
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}   # NopeCHA 打码 API Key
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }} # Telegram 推送 Token
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}     # Telegram Chat ID
          PROXY_URL: "http://127.0.0.1:7890"        # 本地 sing-box 端口
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" python renew_vps.py

      - name: 自动保存调试截图 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          retention-days: 3

      - name: 清理历史运行记录（保留最新5条）
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 5
